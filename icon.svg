<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="moBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <radialGradient id="moGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Space -->
  <rect width="128" height="128" rx="28" fill="#090D16" />
  
  <!-- Outer Glow -->
  <circle cx="64" cy="64" r="54" fill="url(#moGlow)" />

  <!-- Mo Body -->
  <circle cx="64" cy="64" r="44" fill="url(#moBody)" filter="url(#softGlow)" />

  <!-- Eyes -->
  <circle cx="50" cy="56" r="6" fill="#0F172A" />
  <circle cx="52" cy="54" r="2.2" fill="#FFFFFF" />
  
  <circle cx="78" cy="56" r="6" fill="#0F172A" />
  <circle cx="80" cy="54" r="2.2" fill="#FFFFFF" />

  <!-- Rosy cheeks -->
  <circle cx="42" cy="68" r="4.5" fill="#F43F5E" opacity="0.4" />
  <circle cx="86" cy="68" r="4.5" fill="#F43F5E" opacity="0.4" />

  <!-- Smile -->
  <path d="M 52 74 Q 64 86 76 74" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" fill="none" />
</svg>
